<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Feedback Analysis System</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 20px; color: #333; }
.container { max-width: 1200px; margin: 0 auto; }
.hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px; border-radius: 12px; margin-bottom: 30px; text-align: center; }
.hero h1 { font-size: 2.5em; margin-bottom: 10px; }
.hero p { font-size: 1.1em; opacity: 0.9; }
.hero img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 20px; }
.section { background: white; border-radius: 12px; padding: 30px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.section h2 { font-size: 1.5em; margin-bottom: 20px; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; }
.form-group textarea { resize: vertical; min-height: 80px; }
.btn { background: #667eea; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-size: 1em; cursor: pointer; transition: background 0.3s; }
.btn:hover { background: #764ba2; }
.summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
.card { background: #f9f9f9; padding: 20px; border-radius: 8px; text-align: center; }
.card .value { font-size: 2em; font-weight: bold; color: #667eea; }
.card .label { font-size: 0.9em; color: #666; margin-top: 5px; }
.feedback-item { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
.feedback-item .meta { display: flex; justify-content: space-between; font-size: 0.9em; color: #555; margin-bottom: 8px; }
.feedback-item .meta span { background: #e0e7ff; padding: 4px 10px; border-radius: 12px; }
.feedback-item .rating { color: #f5a623; font-weight: bold; }
.feedback-item .text { margin-top: 8px; line-height: 1.4; }
.loading, .error { text-align: center; padding: 20px; color: #888; }
.error { color: #d32f2f; }
</style>
</head>
<body>
<div class="container">
  <!-- Hero Section -->
  <div id="hero" class="hero">
    <h1>Course Feedback Analysis System</h1>
    <p>Submit and view anonymous course feedback effortlessly</p>
    <img src="generated_hero.png" alt="Hero Image" />
  </div>

  <!-- Form Section -->
  <div id="feedback-form" class="section">
    <h2>Submit Feedback</h2>
    <form id="feedbackForm">
      <div class="form-group">
        <label for="course_name">Course Name</label>
        <input type="text" id="course_name" name="course_name" required />
      </div>
      <div class="form-group">
        <label for="instructor_name">Instructor Name</label>
        <input type="text" id="instructor_name" name="instructor_name" required />
      </div>
      <div class="form-group">
        <label for="rating">Rating (1-5)</label>
        <input type="number" id="rating" name="rating" min="1" max="5" required />
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="">Select category</option>
          <option value="Teaching">Teaching</option>
          <option value="Assessment">Assessment</option>
          <option value="Materials">Materials</option>
          <option value="Pace">Pace</option>
          <option value="Engagement">Engagement</option>
        </select>
      </div>
      <div class="form-group">
        <label for="feedback_text">Feedback Text</label>
        <textarea id="feedback_text" name="feedback_text" required></textarea>
      </div>
      <button type="submit" class="btn">Submit Feedback</button>
    </form>
    <div id="formMessage" class="loading" style="display:none;"></div>
  </div>

  <!-- Summary Section -->
  <div id="summary-section" class="section">
    <h2>Summary</h2>
    <div id="summary-cards" class="summary-cards">
      <!-- Cards will be populated by JS -->
    </div>
  </div>

  <!-- Feedback List Section -->
  <div id="feedback-list" class="section">
    <h2>All Feedback</h2>
    <div id="feedback-items">
      <!-- Feedback items will be populated by JS -->
    </div>
  </div>
</div>

<script>
// Store API responses
let feedbackData = null;

// Fetch summary and feedback on page load
async function loadData() {
  try {
    const [summaryRes, feedbackRes] = await Promise.all([
      fetch('/api/summary'),
      fetch('/api/feedback')
    ]);
    const summary = await summaryRes.json();
    feedbackData = await feedbackRes.json();
    renderSummary(summary);
    renderFeedback();
  } catch (err) {
    console.error('Failed to load data:', err);
    document.getElementById('feedback-items').innerHTML = '<div class="error">Failed to load feedback.</div>';
    document.getElementById('summary-cards').innerHTML = '<div class="error">Failed to load summary.</div>';
  }
}

function renderSummary(summary) {
  const cardsContainer = document.getElementById('summary-cards');
  cardsContainer.innerHTML = `
    <div class="card">
      <div class="value">${summary.total_feedback}</div>
      <div class="label">Total Feedback</div>
    </div>
    <div class="card">
      <div class="value">${summary.average_rating.toFixed(1)}</div>
      <div class="label">Average Rating</div>
    </div>
    <div class="card">
      <div class="value">${summary.positive_ratio}%</div>
      <div class="label">Positive Ratio</div>
    </div>
    <div class="card">
      <div class="value">${summary.top_category}</div>
      <div class="label">Top Category</div>
    </div>
  `;
}

function renderFeedback() {
  const container = document.getElementById('feedback-items');
  if (!feedbackData || !feedbackData.feedback || feedbackData.feedback.length === 0) {
    container.innerHTML = '<div class="loading">No feedback yet.</div>';
    return;
  }
  let html = '';
  // Iterate only over feedbackData.feedback
  feedbackData.feedback.forEach(item => {
    html += `
      <div class="feedback-item">
        <div class="meta">
          <span>${item.course_name}</span>
          <span>${item.instructor_name}</span>
          <span>${item.category}</span>
          <span class="rating">${'★'.repeat(item.rating)}${'☆'.repeat(5-item.rating)}</span>
        </div>
        <div class="text">${item.feedback_text}</div>
      </div>
    `;
  });
  container.innerHTML = html;
}

// Handle form submission
document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);
  const payload = {
    course_name: formData.get('course_name'),
    instructor_name: formData.get('instructor_name'),
    rating: Number(formData.get('rating')),
    category: formData.get('category'),
    feedback_text: formData.get('feedback_text')
  };
  const msgDiv = document.getElementById('formMessage');
  msgDiv.style.display = 'block';
  msgDiv.textContent = 'Submitting...';
  try {
    const res = await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('Submission failed');
    msgDiv.textContent = 'Feedback submitted successfully!';
    msgDiv.style.color = 'green';
    form.reset();
    // Reload data
    const [summaryRes, feedbackRes] = await Promise.all([
      fetch('/api/summary'),
      fetch('/api/feedback')
    ]);
    const summary = await summaryRes.json();
    feedbackData = await feedbackRes.json();
    renderSummary(summary);
    renderFeedback();
  } catch (err) {
    msgDiv.textContent = 'Error submitting feedback.';
    msgDiv.style.color = 'red';
  }
});

// Initial load
loadData();
</script>
</body>
</html>
